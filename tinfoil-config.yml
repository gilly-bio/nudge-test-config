# The nudge brain's Tinfoil configuration, release t0.1.4. Rendered by nudge_infra.deploy from a
# values file; don't edit it by hand. Everything here is public and measured: a phone checks this release
# before it grants the brain a user's key. What each part is for: infra/deploy/README.md in the brain's repo.
cvm-version: "0.14.17"
cpus: 2
memory: 8192

# Our keyserver (tinfoilsh/keyserver). It releases the secrets below at every boot, only to a release and
# domain our approver let in, or the enclave doesn't boot.
keyserver-url: "https://test-keys.gillynudge.com"

networks:
  brain-out:  # every host the brain can reach; adding one is a release
    egress: allowlist
    allow:
      - "80b36accfd5e10673ef2f7b953b9f0cd.r2.cloudflarestorage.com"
      - "pub-cccd4cc8e03f43c1866f1e30d98d70c4.r2.dev"
  inference-out:  # the inference router, and what verifying it takes
    egress: allowlist
    allow:
      - "inference.tinfoil.sh"
      - "atc.tinfoil.sh"
      - "github-proxy.tinfoil.sh"
      - "kds-proxy.tinfoil.sh"
  model:  # closed: the brain reaches the proxy here, and nothing else
    egress: closed  # spelled out: Tinfoil's validator refuses an empty network ({})

containers:
  - name: brain
    image: "ghcr.io/gilly-bio/nudge-beta-brain@sha256:9b98ed326a688bec1a719a01a29d2b496c98fab5a359ea8863ba91ab5f206a66"
    networks: [brain-out, model]
    restart: always
    tmpfs:
      /tmp: "size=64m"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/instance', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 2m
    env:
      - NUDGE_REPO: "gilly-bio/nudge-test-config"
      - NUDGE_RELEASE: "t0.1.4"
      - NUDGE_MODEL_BACKEND: "live"
      - NUDGE_MODEL_BASE: "http://model-proxy:3301/v1"
      - NUDGE_IMAGE_DIGEST: "sha256:9b98ed326a688bec1a719a01a29d2b496c98fab5a359ea8863ba91ab5f206a66"
      - NUDGE_STORE: "s3"
      - NUDGE_S3_ENDPOINT: "https://80b36accfd5e10673ef2f7b953b9f0cd.r2.cloudflarestorage.com"
      - NUDGE_S3_BUCKET: "nudge-beta-test"
      - NUDGE_S3_REGION: "auto"
      - NUDGE_RELEASE_LOG: "https://pub-cccd4cc8e03f43c1866f1e30d98d70c4.r2.dev/"
      - NUDGE_SWITCHES_URL: "https://pub-cccd4cc8e03f43c1866f1e30d98d70c4.r2.dev/switches.json"
      - NUDGE_SWITCH_KEYS: "{}"
      - NUDGE_RELEASE_KEYS: "{\"5c289b9c7c543f84\": \"+PA1u+MIfL7ei0OlCMttRTtuSTWBBhhaovkQeuXd7Mg=\"}"
      - NUDGE_LOG_KEYS: "{\"c77ec28927b3ac6b\": \"erfKMsI/3izu0U+jOOeK5Nr8pRiELs9jN7Kpc5mFKkA=\"}"
    secrets:  # NUDGE_SECRET_<NAME>, base64 (nudge_infra.opsecrets)
      - NUDGE_SECRET_OPS_KEY
      - NUDGE_SECRET_TINFOIL_KEY
      - NUDGE_SECRET_S3_CREDENTIALS
  - name: model-proxy
    image: "ghcr.io/tinfoilsh/tinfoil-proxy@sha256:f048419da6d3df1abe80628e960b87e46d12f97bac5e10535f8164c0242ee18f"
    command: ["--bind", "0.0.0.0", "--port", "3301", "--host", "inference.tinfoil.sh", "--repo", "tinfoilsh/confidential-model-router", "--allowed-host", "model-proxy"]
    networks: [inference-out, model]
    restart: always

shim:
  upstream-port: 8080
  upstream-container: brain
  paths:  # nothing else is reachable
    - /v1/instance
    - /v1/grant
    - /v1/revoke
    - /v1/status
    - /v1/ingest
    - /v1/sync
    - /v1/mail/address
    - /v1/connect
    - /v1/disconnect
    - /v1/pair
    - /v1/pair/fetch
    - /v1/recovery
    - /v1/recovery/remove
    - /v1/recover/fetch
    - /v1/devices
    - /v1/devices/remove
